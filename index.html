<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My First AI Web</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <main class="card">
    <h1>My First AI Web</h1>
    <p class="subtitle">A tiny page built by an AI agent for Homework 01, Exercise 1.2.</p>

    <p id="message" class="message" role="status" aria-live="polite">
      The message has not changed yet.
    </p>

    <div class="actions">
      <button id="change-button" type="button">Change message</button>
      <button id="reset-button" type="button" class="secondary" disabled>Reset</button>
    </div>

    <p class="hint">Click the button and the message above should change. Reset restores the starting message.</p>
  </main>

  <script src="assets/app.js"></script>
</body>
</html>
